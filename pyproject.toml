[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scilog-viewer"
version = "0.1.0"
description = "Read and write SciLog (PSI's electronic logbook) in the browser: a flow of days, outline and map, fuzzy search, editing, views."
requires-python = ">=3.10"
dependencies = ["tornado>=6", "requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["scilog_viewer"]

[tool.setuptools.package-data]
scilog_viewer = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
