# The Python package to PyPI, for tags v*: tested, built, uploaded through PyPI's
# trusted publishing (the pending publisher for this file and the "pypi" environment),
# so no API token is kept anywhere.
name: publish
on:
  push:
    tags: ["v*.*.*"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }  # setuptools-scm takes the version from the tag
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]" build twine
      - run: pytest -q
      - run: python -m build && python -m twine check --strict dist/*
      - name: the built version is the tag's
        run: |
          want="${GITHUB_REF_NAME#v}"; ls dist/
          test -f "dist/scilog_viewer-${want}.tar.gz" || { echo "sdist is not version $want (tag not on this commit?)"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scilog-viewer
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
