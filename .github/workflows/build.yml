# The SciLog viewer as one program per system, as installers for Linux (.deb, .rpm, both
# with a menu entry and its icon) and Windows (Inno Setup), and as an Android app. Runs on
# demand and for tags v*; a tag also makes a release with all of them attached.
# Android signing key: repository secrets SCILOG_KEYSTORE_B64 / SCILOG_KEYSTORE_PASSWORD
# (otherwise debug-signed, and an update must then be installed after removing the old app).
name: build
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[dev]"
      - run: pytest -q
  program:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: scilog-viewer-linux-x86_64 }
          - { os: windows-latest, name: scilog-viewer-windows-x86_64.exe }
          - { os: macos-15, name: scilog-viewer-macos-arm64 }  # macos-14 is no longer offered
          - { os: macos-15-intel, name: scilog-viewer-macos-x86_64 }  # macos-13 is retired
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ".[build]"
      - run: sh packaging/build.sh
        shell: bash
      - name: smoke test (starts, serves the page, stops)
        shell: bash
        run: |
          exe=dist/scilog-viewer; [ -f dist/scilog-viewer.exe ] && exe=dist/scilog-viewer.exe
          python packaging/smoke_test.py "$exe"
      - name: name it
        shell: bash
        run: |
          src=dist/scilog-viewer; [ -f dist/scilog-viewer.exe ] && src=dist/scilog-viewer.exe
          mkdir out && cp "$src" "out/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "out/${{ matrix.name }}" }
      # and the same program as something a desktop installs: an entry in the menu, with its icon
      - name: a .deb and an .rpm
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq rpm
          sh packaging/linux_package.sh
      - name: a Windows installer
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          python packaging/make_icons.py build/icons
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$iscc" ] || choco install innosetup -y --no-progress
          version=${GITHUB_REF_NAME#v}
          case "$version" in "" | *[!0-9.]*) version=0.0.0 ;; esac
          # "//D": one slash is what the compiler gets, two keep this shell from reading
          # the switch as a path and handing it over as C:/Program Files/Git/D...
          "$iscc" "//DAppVersion=$version" packaging/windows_setup.iss
          ls -l dist/scilog-viewer-setup-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        if: startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'windows')
        with:
          name: "installer-${{ matrix.os }}"
          if-no-files-found: error
          path: |
            dist/*.deb
            dist/*.rpm
            dist/scilog-viewer-setup-*.exe
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }  # Chaquopy builds with the same Python version as the app's
      - name: Build the APK
        working-directory: android
        env:
          SCILOG_KEYSTORE_B64: ${{ secrets.SCILOG_KEYSTORE_B64 }}
          SCILOG_KEYSTORE_PASSWORD: ${{ secrets.SCILOG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$SCILOG_KEYSTORE_B64" ]; then
            echo "$SCILOG_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/scilog.jks"
            export SCILOG_KEYSTORE="$RUNNER_TEMP/scilog.jks"
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease --console=plain
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk ../out/scilog-viewer-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: scilog-viewer-android.apk, path: out/scilog-viewer-android.apk }
  release:
    # with whatever was built: one platform without a runner (macOS has been) must not hold back the rest
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.android.result == 'success'
    needs: [program, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: programs, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: "programs/*" }
